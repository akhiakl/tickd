name: Bug report
description: Something isn't working the way it should.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search [existing issues](https://github.com/akhiakl/tickd/issues)
        first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, as minimal as possible.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: auth-mode
    attributes:
      label: Auth mode
      description: Was `AUTH0_ENABLED` on or off?
      options:
        - Guest mode (default, AUTH0_ENABLED unset/false)
        - Auth0 hosted login (AUTH0_ENABLED=true)
        - Not sure
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. local dev (next dev), Vercel preview, production - browser/OS"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Console errors, server logs, or a screenshot - drag and drop images directly here.
    validations:
      required: false
