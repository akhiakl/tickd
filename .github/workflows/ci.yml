name: CI

# Post-merge sanity check. Pull requests get the richer
# `.github/workflows/pr-quality.yml` gate instead (unit/coverage, e2e, a11y,
# each reported as its own table in a PR comment); this workflow just
# confirms main itself stays green after a merge.
on:
  push:
    branches: [main]

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/tickd_test
  AUTH_SECRET: ci-test-secret-do-not-use-in-production
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

jobs:
  lint-and-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  e2e-and-a11y:
    name: Playwright end-to-end and accessibility tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tickd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=e2e --project=a11y
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
