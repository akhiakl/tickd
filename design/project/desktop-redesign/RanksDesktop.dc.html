<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg: #f7f3e9; --surface: #e9e3d2; --text: #1d2019; --muted: #5f6455;
      --panel: #232720; --panel-2: #3b4034; --panel-soft: #9aa08c; --on-panel: #f6f1e6;
      --accent: #55743f; --accent-d: #3f5a2c; --flame: #d07a3c; --flame-light: #eda061;
      --gold: #c8952e; --gold-bg: #f3e4bd; --silver: #8b8f7f; --silver-bg: #e6e4da; --bronze: #a3651f; --bronze-bg: #ecd8c2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Figtree', system-ui, sans-serif; }
    .heading { font-family: 'Caprasimo', Georgia, serif; font-weight: 400; margin: 0; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 40px 40px 64px; }
    .tab { display:flex; align-items:center; gap:8px; padding: 11px 22px; border-radius: 999px; font-family:'Caprasimo', serif; font-size: 14.5px; }
    .win { flex:1; text-align:center; padding: 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
    .row { display:flex; align-items:center; gap: 14px; border-radius: 18px; padding: 12px 16px; }
    @media (max-width: 480px) { .wrap { padding: 20px 20px 40px; } .top-name { font-size: 24px !important; } }
  </style>
</helmet>

<div class="wrap">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 22px;">
    <div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="heading top-name" style="font-size: 30px;">The August Eight</span>
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
      <div style="font-size: 14px; color: var(--muted); margin-top: 3px;">Standings &middot; by items completed</div>
    </div>
    <div style="display:flex; align-items:center; gap: 12px;">
      <div style="width:44px; height:44px; border-radius:999px; background:var(--surface); display:flex; align-items:center; justify-content:center;">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
      </div>
      <div style="width:40px; height:40px; border-radius:999px; background:var(--accent); color:var(--on-panel); display:flex; align-items:center; justify-content:center;" class="heading">D</div>
    </div>
  </div>

  <div style="display:flex; gap: 10px; margin-bottom: 24px;">
    <div class="tab" style="background: var(--surface); color: var(--text);">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path></svg>
      Today
    </div>
    <div class="tab" style="background: var(--surface); color: var(--text);">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      Wall
    </div>
    <div class="tab" style="background: var(--accent); color: var(--on-panel);">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"></path><path d="M12 20V4"></path><path d="M6 20v-6"></path></svg>
      Ranks
    </div>
  </div>

  <div style="display:flex; gap: 6px; background: var(--surface); border-radius: 999px; padding: 4px; margin-bottom: 28px;">
    <div class="win" style="background: var(--panel); color: var(--bg);">This week</div>
    <div class="win" style="color: var(--muted);">This month</div>
    <div class="win" style="color: var(--muted);">All time</div>
  </div>

  <div style="display:flex; flex-direction:column; gap: 8px;">

    <div class="row" style="background: var(--gold-bg);">
      <div style="width:38px; height:38px; border-radius:999px; background:var(--gold); color:var(--on-panel); display:flex; align-items:center; justify-content:center; flex:none;">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" stroke="none"><path d="M12 2 9.5 8.5 3 9l5 4.6L6.5 21 12 17.3 17.5 21 16 13.6 21 9l-6.5-.5Z"></path></svg>
      </div>
      <div style="width:38px; height:38px; border-radius:999px; background:var(--accent); color:var(--on-panel); display:flex; align-items:center; justify-content:center; flex:none; font-size:14px;" class="heading">A</div>
      <span style="flex:1; font-size: 16px; font-weight: 700;">Ada</span>
      <div style="display:flex; align-items:center; gap:5px; color:var(--flame);">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="none"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <span style="font-size:13px; font-weight:700;">6</span>
      </div>
      <span class="heading" style="font-size: 20px; width: 32px; text-align:right;">54</span>
    </div>

    <div class="row" style="background: var(--silver-bg);">
      <div style="width:38px; height:38px; border-radius:999px; background:var(--silver); color:var(--on-panel); display:flex; align-items:center; justify-content:center; flex:none;">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" stroke="none"><path d="M12 2 9.5 8.5 3 9l5 4.6L6.5 21 12 17.3 17.5 21 16 13.6 21 9l-6.5-.5Z"></path></svg>
      </div>
      <div style="width:38px; height:38px; border-radius:999px; background:#8aa26a; color:var(--on-panel); display:flex; align-items:center; justify-content:center; flex:none; font-size:14px;" class="heading">P</div>
      <span style="flex:1; font-size: 16px; font-weight: 700;">Priya</span>
      <div style="display:flex; align-items:center; gap:5px; color:var(--flame);">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="none"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <span style="font-size:13px; font-weight:700;">4</span>
      </div>
      <span class="heading" style="font-size: 20px; width: 32px; text-align:right;">49</span>
    </div>

    <div class="row" style="background: var(--bronze-bg);">
      <div style="width:38px; height:38px; border-radius:999px; background:var(--bronze); color:var(--on-panel); display:flex; align-items:center; justify-content:center; flex:none;">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" stroke="none"><path d="M12 2 9.5 8.5 3 9l5 4.6L6.5 21 12 17.3 17.5 21 16 13.6 21 9l-6.5-.5Z"></path></svg>
      </div>
      <div style="width:38px; height:38px; border-radius:999px; background:#3b4034; color:var(--on-panel); display:flex; align-items:center; justify-content:center; flex:none; font-size:14px;" class="heading">M</div>
      <span style="flex:1; font-size: 16px; font-weight: 700;">Marcus</span>
      <div style="display:flex; align-items:center; gap:5px; color:var(--flame);">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="none"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <span style="font-size:13px; font-weight:700;">2</span>
      </div>
      <span class="heading" style="font-size: 20px; width: 32px; text-align:right;">47</span>
    </div>

    <!-- 4th onward: same plain row treatment as the original -->
    <div class="row" style="background: var(--surface); margin-top: 6px;">
      <span style="width:38px; text-align:center; font-size: 15px; color: var(--muted); font-weight:700;">4</span>
      <div style="width:34px; height:34px; border-radius:999px; background:#c8dab0; color:var(--text); display:flex; align-items:center; justify-content:center; flex:none; font-size:13px;" class="heading">L</div>
      <span style="flex:1; font-size: 15px; font-weight: 600;">Lena</span>
      <div style="display:flex; align-items:center; gap:5px; color:var(--muted);">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" stroke="none"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <span style="font-size:12.5px; font-weight:700;">1</span>
      </div>
      <span style="font-size: 15px; font-weight: 700; width: 32px; text-align:right;">41</span>
    </div>
    <div class="row" style="background: var(--surface);">
      <span style="width:38px; text-align:center; font-size: 15px; color: var(--muted); font-weight:700;">5</span>
      <div style="width:34px; height:34px; border-radius:999px; background:#d07a3c; color:var(--on-panel); display:flex; align-items:center; justify-content:center; flex:none; font-size:13px;" class="heading">T</div>
      <span style="flex:1; font-size: 15px; font-weight: 600;">Tomas</span>
      <div style="display:flex; align-items:center; gap:5px; color:var(--muted);">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" stroke="none"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <span style="font-size:12.5px; font-weight:700;">0</span>
      </div>
      <span style="font-size: 15px; font-weight: 700; width: 32px; text-align:right;">38</span>
    </div>
    <div class="row" style="background: var(--surface);">
      <span style="width:38px; text-align:center; font-size: 15px; color: var(--muted); font-weight:700;">6</span>
      <div style="width:34px; height:34px; border-radius:999px; background:#a35a1f; color:var(--on-panel); display:flex; align-items:center; justify-content:center; flex:none; font-size:13px;" class="heading">A</div>
      <span style="flex:1; font-size: 15px; font-weight: 600;">Aisha</span>
      <div style="display:flex; align-items:center; gap:5px; color:var(--muted);">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" stroke="none"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <span style="font-size:12.5px; font-weight:700;">0</span>
      </div>
      <span style="font-size: 15px; font-weight: 700; width: 32px; text-align:right;">35</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
